function travelCard(x,type){const cls=type.includes('یک‌روزه')?'one-day':'two-day';const ex=travelExtra[x[0]]||['طبیعت و جاذبه‌های محلی','اقامت بر اساس شرایط مقصد'];const stayLine=cls==='two-day'?`<div class="travel-tags"><span>✨ ${ex[0]}</span><span>🏡 ${ex[1]}</span></div>`:'';return `<article class="card travel ${cls}"><span class="kind">${type}</span><h3>${x[0]}</h3><div class="meta">📍 موقعیت: ${x[1]}</div><div class="meta">🚗 فاصله از تهران: ${x[2]} · زمان رانندگی: ${x[3]}</div><div class="meta">📍 فاصله از قم: ${routeInfo[x[0]]?routeInfo[x[0]][0]:'حدود —'}</div><div class="meta">🍂 وضعیت فصل: ${x[6]}</div><p class="desc">${x[4]}</p><div class="detail"><b>جاهای دیدنی / تجربه:</b><br>${x[5]}</div>${stayLine}${routeInfo[x[0]]?`<div class="route-note"><b>نکته مسیر:</b> ${routeInfo[x[0]][1]}</div>`:''}<div class="actions"><button class="approve" onclick="toggle(this)">تأیید</button></div></article>`}
function eventCard(x,month='',cat=''){const cls=cat==='نمایشگاه‌ها'?'exhibition':cat==='موسیقی'?'music':cat==='تئاتر'?'theater':cat==='گالری و هنرهای تجسمی'?'gallery':'special';return `<article class="card event ${cls}"><span class="kind">${x[2]}</span><h3>${x[0]}</h3>${month?`<div class="meta">🗓 ماه: ${month}</div>`:''}<div class="meta">📅 تاریخ: ${x[1]}</div><div class="meta">📍 محل: ${x[3]}</div><p class="desc">${x[4]}</p><div class="source">منبع/وضعیت: ${x[5]} · ${x[6]}</div><div class="actions"><button class="approve" onclick="toggle(this)">تأیید</button></div></article>`}
function render(){for(const m of Object.keys(travel)){const d=travel[m],e=events[m];const eventHtml=Object.entries(e).map(([cat,items])=>`<section class="event-group"><div class="event-group-head"><h3>${cat}</h3><span>${cat==='نمایشگاه‌ها'?'نمایشگاه‌های تهران، شهر آفتاب و مراکز اطراف':cat==='موسیقی'?'اجراهای اعلام‌شده تا زمان به‌روزرسانی':cat==='تئاتر'?'اجراهای اعلام‌شده تا زمان به‌روزرسانی':cat==='گالری و هنرهای تجسمی'?'نمایشگاه‌ها و افتتاحیه‌های هنری':'سینما و سایر رویدادهای شهری'}</span></div><div class="grid">${items.map(x=>eventCard(x,'',cat)).join('')}</div></section>`).join('');document.getElementById(m).innerHTML=`<section class="section"><div class="section-head"><h2>سفرهای یک‌روزه</h2></div><div class="grid">${d.one.map(x=>travelCard(x,'سفر یک‌روزه')).join('')}</div></section><section class="section"><div class="section-head"><h2>سفرهای دو‌روزه</h2></div><div class="grid">${d.two.map(x=>travelCard(x,'سفر دو‌روزه')).join('')}</div></section><section class="section"><div class="section-head"><h2>ایده‌های تفریحی و رویدادها</h2><span>دسته‌بندی‌شده</span></div>${eventHtml}</section>`}}
function renderAll(){const labels={mehr:'مهر ۱۴۰۵',aban:'آبان ۱۴۰۵',azar:'آذر ۱۴۰۵'};let html='';
let one=[],two=[];for(const m of ['mehr','aban','azar']){travel[m].one.forEach(x=>one.push({x,m}));travel[m].two.forEach(x=>two.push({x,m}));}
html+=`<section class="section"><div class="section-head"><h2>همه سفرهای یک‌روزه</h2><span>مهر تا آذر</span></div><div class="grid">${one.map(o=>travelCard(o.x,'سفر یک‌روزه')).join('')}</div></section>`;
html+=`<section class="section"><div class="section-head"><h2>همه سفرهای دو‌روزه</h2><span>مهر تا آذر</span></div><div class="grid">${two.map(o=>travelCard(o.x,'سفر دو‌روزه')).join('')}</div></section>`;
const cats=['نمایشگاه‌ها','موسیقی','تئاتر','گالری و هنرهای تجسمی','رویدادهای خاص'];for(const cat of cats){let items=[];for(const m of ['mehr','aban','azar']){(events[m][cat]||[]).forEach(x=>items.push({x,m}))}if(items.length)html+=`<section class="event-group"><div class="event-group-head"><h3>${cat}</h3><span>همه ماه‌های پاییز</span></div><div class="grid">${items.map(o=>eventCard(o.x,labels[o.m],cat)).join('')}</div></section>`}document.getElementById('all').innerHTML=html}
function setTheme(theme,b){document.body.classList.remove('theme-earth','theme-night');if(theme==='earth')document.body.classList.add('theme-earth');if(theme==='night')document.body.classList.add('theme-night');document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
function toggle(btn){btn.classList.toggle('on')}
function showMonth(id,b){document.querySelectorAll('.month').forEach(x=>x.classList.remove('active'));const target=document.getElementById(id);if(target){target.classList.add('active')}document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
const UPDATE_ENDPOINT_KEY='tripPlannerUpdateEndpoint';async function updateInfo(){const last=document.getElementById('last'),state=document.getElementById('updateState');state.className='update-state';state.textContent='در حال بررسی اطلاعات آنلاین…';let endpoint=localStorage.getItem(UPDATE_ENDPOINT_KEY)||'';if(!endpoint){endpoint=prompt('برای فعال شدن به‌روزرسانی خودکار، آدرس سرویس آنلاین تقویم را وارد کنید. این آدرس فقط یک‌بار در همین مرورگر ذخیره می‌شود:','');if(endpoint){localStorage.setItem(UPDATE_ENDPOINT_KEY,endpoint.trim())}else{state.classList.add('update-error');state.textContent='سرویس آنلاین هنوز متصل نشده؛ اطلاعات فعلی حفظ شد.';return}}try{const r=await fetch(endpoint,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();if(data.events){Object.assign(events,data.events);render();renderAll()}if(data.travel){Object.assign(travel,data.travel);render();renderAll()}last.textContent='آخرین به‌روزرسانی: '+new Intl.DateTimeFormat('fa-IR',{dateStyle:'full',timeStyle:'short'}).format(new Date());state.classList.add('update-online');state.textContent='اطلاعات آنلاین با موفقیت دریافت و اعمال شد.'}catch(e){state.classList.add('update-error');state.textContent='اتصال به سرویس آنلاین ناموفق بود؛ اطلاعات فعلی حفظ شد.'}}
render();renderAll();
</script></body></html>
